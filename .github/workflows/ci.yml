name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"

      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck

  smoke:
    name: Smoke E2E
    runs-on: ubuntu-latest
    needs: quality
    env:
      WDIO_BASE_URL: http://localhost:4200

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Toolshop app (test target)
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: toolshop-app

      - name: Start Toolshop app
        working-directory: toolshop-app
        run: docker compose -f docker-compose.yml up -d

      - name: Wait for Toolshop app to be ready
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:4200 > /dev/null; then
              echo "App is up after ${i} attempts"
              exit 0
            fi
            sleep 5
          done
          echo "App did not become ready in time"
          docker compose -f toolshop-app/docker-compose.yml logs
          exit 1

      - name: DEBUG - inspect actual app state after healthcheck
        run: |
          echo "===== API response: /api/products (via web:8091) ====="
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" http://localhost:8091/api/products
          echo "===== API response: /api/categories (via web:8091) ====="
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" http://localhost:8091/api/categories
          echo "===== mariadb container logs ====="
          docker compose -f toolshop-app/docker-compose.yml logs mariadb --tail=100
          echo "===== laravel-api container logs ====="
          docker compose -f toolshop-app/docker-compose.yml logs laravel-api --tail=100
          echo "===== container status ====="
          docker compose -f toolshop-app/docker-compose.yml ps

      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"

      - run: npm ci
      - run: npm run wdio:smoke

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: .tmp/report/
          retention-days: 7

      - name: Stop Toolshop app
        if: always()
        working-directory: toolshop-app
        run: docker compose -f docker-compose.yml down -v
