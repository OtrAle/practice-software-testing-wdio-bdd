name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"

      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck

  smoke:
    name: Smoke E2E
    runs-on: ubuntu-latest
    needs: quality
    env:
      WDIO_BASE_URL: http://localhost:4200

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Toolshop app (test target)
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: toolshop-app

      - name: Start Toolshop app
        working-directory: toolshop-app
        run: |
          docker compose -f docker-compose.yml up -d --force-recreate
          sleep 30s

      - name: Install API dependencies
        working-directory: toolshop-app
        run: docker compose exec -T -u root laravel-api composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi

      - name: Wait for MariaDB to be ready
        working-directory: toolshop-app
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent 2>/dev/null; then
              echo "MariaDB is ready!"
              exit 0
            fi
            echo "Attempt $i/30 - not ready yet, waiting 2s..."
            sleep 2
          done
          echo "MariaDB never became ready"
          docker compose -f docker-compose.yml logs mariadb --tail=100
          exit 1

      - name: Run database migrations and seed
        working-directory: toolshop-app
        run: docker compose exec -T laravel-api php artisan migrate:refresh --seed

      - name: Verify API is responding
        run: |
          curl -v -X GET 'http://localhost:8091/status'
          curl -v -X POST 'http://localhost:8091/users/login' \
            -H 'Content-Type: application/json' \
            --data-raw '{"email":"customer@practicesoftwaretesting.com","password":"welcome01"}'

      - name: Wait for Toolshop app to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4200 > /dev/null; then
              echo "App is up after ${i} attempts"
              exit 0
            fi
            sleep 5
          done
          echo "App did not become ready in time"
          docker compose -f toolshop-app/docker-compose.yml logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"

      - run: npm ci
      - run: npm run wdio:smoke

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: .tmp/report/
          retention-days: 7

      - name: Stop Toolshop app
        if: always()
        working-directory: toolshop-app
        run: docker compose -f docker-compose.yml down -v
