name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"

      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck

  smoke:
    name: Smoke E2E
    runs-on: ubuntu-latest
    needs: quality
    env:
      WDIO_BASE_URL: http://localhost:4200

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Toolshop app (test target)
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: toolshop-app

      - name: Start Toolshop app
        working-directory: toolshop-app
        run: docker compose -f docker-compose.yml up -d

      - name: Run database migrations and seed
        working-directory: toolshop-app
        run: |
          for i in $(seq 1 20); do
            if docker compose -f docker-compose.yml exec -T laravel-api php artisan migrate:fresh --seed --force; then
              echo "Migrations and seed completed"
              exit 0
            fi
            echo "API/DB not ready yet, retrying in 5s... (${i}/20)"
            sleep 5
          done
          echo "Migrations never succeeded"
          docker compose -f docker-compose.yml logs mariadb laravel-api --tail=100
          exit 1

      - name: Wait for Toolshop app to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8091/api/products | grep -q '"data"'; then
              echo "API is serving product data after ${i} attempts"
              exit 0
            fi
            sleep 5
          done
          echo "App did not become ready in time"
          docker compose -f toolshop-app/docker-compose.yml logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"

      - run: npm ci
      - run: npm run wdio:smoke

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: .tmp/report/
          retention-days: 7

      - name: Stop Toolshop app
        if: always()
        working-directory: toolshop-app
        run: docker compose -f docker-compose.yml down -v
